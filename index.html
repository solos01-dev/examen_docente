<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen en Línea</title>
    <!-- Tailwind CSS para un diseño limpio y profesional -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-xl mx-4">
        <!-- Cabecera -->
        <div id="header-container" class="flex justify-between items-center mb-6 border-b pb-4">
            <span id="question-progress" class="text-sm font-semibold text-slate-500">Pregunta 1 de 10</span>
            <div class="bg-amber-100 text-amber-800 px-3 py-1 rounded-full text-sm font-bold flex items-center gap-1">
                ⏱️ <span id="timer">30</span>s
            </div>
        </div>

        <!-- Contenedor de Pregunta -->
        <div id="quiz-container">
            <h2 id="question-text" class="text-xl font-bold text-slate-800 mb-6">Cargando pregunta...</h2>
            <div id="options-container" class="space-y-3">
                <!-- Opciones generadas por JS -->
            </div>
        </div>

        <!-- Pantalla de Resultados (Oculta al inicio) -->
        <div id="result-container" class="hidden text-center py-6">
            <h2 class="text-2xl font-bold text-slate-800 mb-2">¡Examen Finalizado!</h2>
            <p class="text-sm text-slate-500 mb-4">Evaluación completada y registrada.</p>
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6">
                <p id="score-text" class="text-xl font-bold text-slate-700"></p>
            </div>
            <p class="text-xs text-slate-400">Ya puedes cerrar esta ventana o pestaña.</p>
        </div>
    </div>

    <script>
        // BANCO TOTAL DE 50 PREGUNTAS
        // (Aquí puedes colocar las 50 preguntas completas del docente)
        const bancoPreguntas = [
            { pregunta: "¿Cuál es la capital de Bolivia?", opciones: ["La Paz y Sucre", "Santa Cruz", "Cochabamba", "Tarija"], correcta: 0 },
            { pregunta: "¿Qué lenguaje se usa principalmente para estilizar páginas web?", opciones: ["Python", "HTML", "CSS", "SQL"], correcta: 2 },
            { pregunta: "¿Cuál es el resultado de 5 + 3 * 2 en programación/matemáticas?", opciones: ["16", "11", "10", "13"], correcta: 1 },
            { pregunta: "¿Qué etiqueta HTML se usa para crear un enlace?", opciones: ["<link>", "<a>", "<href>", "<url>"], correcta: 1 },
            { pregunta: "¿Qué sistema gestor de bases de datos es relacional y de código abierto muy popular?", opciones: ["MongoDB", "PostgreSQL", "Redis", "Firebase"], correcta: 1 },
            { pregunta: "¿Cuál de los siguientes es un lenguaje de programación backend?", opciones: ["CSS", "Python", "HTML", "Tailwind"], correcta: 1 },
            { pregunta: "¿Qué significa la sigla CSS?", opciones: ["Cascading Style Sheets", "Creative Style System", "Computer Styled Sheets", "Cascading Simple Syntax"], correcta: 0 },
            { pregunta: "¿Cuál es el puerto por defecto de un servidor HTTP local de desarrollo en Django?", opciones: ["80", "3000", "8000", "5432"], correcta: 2 },
            { pregunta: "¿Qué estructura de datos almacena elementos en orden LIFO (Last In, First Out)?", opciones: ["Cola (Queue)", "Pila (Stack)", "Árbol", "Grafo"], correcta: 1 },
            { pregunta: "¿Qué comando de Git se usa para enviar cambios a un repositorio remoto?", opciones: ["git pull", "git commit", "git push", "git clone"], correcta: 2 },
            // Puedes seguir agregando más preguntas hasta completar las 50 siguiendo la misma estructura...
        ];

        let examenActual = [];
        let indiceActual = 0;
        let puntaje = 0;
        let tiempoRestante = 30;
        let temporizador;
        let respondido = false;

        function iniciarQuiz() {
            // 1. Mezclar todo el banco global aleatoriamente
            let bancoMeclado = [...bancoPreguntas].sort(() => Math.random() - 0.5);
            
            // 2. Extraer exactamente 10 preguntas aleatorias para este estudiante
            examenActual = bancoMeclado.slice(0, 10);
            
            indiceActual = 0;
            puntaje = 0;
            
            document.getElementById('result-container').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            document.getElementById('header-container').classList.remove('hidden');
            
            cargarPregunta();
        }

        function cargarPregunta() {
            clearInterval(temporizador);
            respondido = false;
            tiempoRestante = 30;
            document.getElementById('timer').innerText = tiempoRestante;

            if (indiceActual >= examenActual.length) {
                mostrarResultados();
                return;
            }

            const q = examenActual[indiceActual];
            document.getElementById('question-progress').innerText = `Pregunta ${indiceActual + 1} de ${examenActual.length}`;
            document.getElementById('question-text').innerText = q.pregunta;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            // Mezclar también las opciones de cada pregunta para que cambien de posición
            const opcionesConIndice = q.opciones.map((op, i) => ({ texto: op, esOriginal: i === q.correcta }));
            opcionesConIndice.sort(() => Math.random() - 0.5);

            opcionesConIndice.forEach((opcion) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 hover:bg-slate-50 font-medium text-slate-700 transition flex justify-between items-center shadow-sm";
                btn.innerHTML = `<span>${opcion.texto}</span>`;
                btn.onclick = () => verificarRespuesta(opcion.esOriginal, btn, opcionesConIndice);
                optionsContainer.appendChild(btn);
            });

            iniciarTemporizador();
        }

        function iniciarTemporizador() {
            temporizador = setInterval(() => {
                tiempoRestante--;
                document.getElementById('timer').innerText = tiempoRestante;
                
                if (tiempoRestante <= 0) {
                    clearInterval(temporizador);
                    tiempoAgotado();
                }
            }, 1000);
        }

        function tiempoAgotado() {
            if (respondido) return;
            respondido = true;

            // Si se acaba el tiempo, marca por defecto la respuesta como incorrecta 
            // y muestra cuál era la correcta antes de pasar a la siguiente
            const botones = document.getElementById('options-container').children;
            Array.from(botones).forEach((btn) => {
                btn.disabled = true;
            });

            // Dar un pequeño aviso visual o pasar de largo tras 1 segundo
            setTimeout(() => {
                indiceActual++;
                cargarPregunta();
            }, 1200);
        }

        function verificarRespuesta(esCorrecta, botonSeleccionado, todasLasOpciones) {
            if (respondido) return;
            respondido = true;
            clearInterval(temporizador);

            const botones = document.getElementById('options-container').children;

            // Deshabilitar todos y pintar la respuesta correcta
            Array.from(botones).forEach((btn, idx) => {
                btn.disabled = true;
                if (todasLasOpciones[idx] && todasLasOpciones[idx].esOriginal) {
                    btn.classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                }
            });

            if (esCorrecta) {
                puntaje++;
                if (botonSeleccionado) {
                    botonSeleccionado.classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                }
            } else {
                if (botonSeleccionado) {
                    botonSeleccionado.classList.add('bg-red-100', 'border-red-500', 'text-red-800');
                }
            }

            // Pasar a la siguiente pregunta tras 1.5 segundos
            setTimeout(() => {
                indiceActual++;
                cargarPregunta();
            }, 1500);
        }

        function mostrarResultados() {
            document.getElementById('header-container').classList.add('hidden');
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('result-container').classList.remove('hidden');
            
            const notaFinal = (puntaje / examenActual.length) * 100;
            document.getElementById('score-text').innerHTML = `Tu calificación: <span class="text-blue-600 font-extrabold">${puntaje} / ${examenActual.length}</span> (${notaFinal.toFixed(0)}%)`;
        }

        // Arrancar examen al cargar la página
        iniciarQuiz();
    </script>
</body>
</html>
