<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen en Línea</title>
    <!-- Tailwind CSS para un diseño limpio y profesional -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-xl mx-4">
        <!-- Cabecera -->
        <div id="header-container" class="flex justify-between items-center mb-6 border-b pb-4">
            <span id="question-progress" class="text-sm font-semibold text-slate-500">Pregunta 1 de 10</span>
            <div class="bg-amber-100 text-amber-800 px-3 py-1 rounded-full text-sm font-bold flex items-center gap-1">
                ⏱️ <span id="timer">30</span>s
            </div>
        </div>

        <!-- Contenedor de Pregunta -->
        <div id="quiz-container">
            <h2 id="question-text" class="text-xl font-bold text-slate-800 mb-6">Cargando pregunta...</h2>
            <div id="options-container" class="space-y-3">
                <!-- Opciones generadas por JS -->
            </div>
        </div>

        <!-- Pantalla de Resultados (Oculta al inicio) -->
        <div id="result-container" class="hidden text-center py-6">
            <h2 class="text-2xl font-bold text-slate-800 mb-2">¡Examen Finalizado!</h2>
            <p class="text-sm text-slate-500 mb-4">Evaluación completada y registrada.</p>
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6">
                <p id="score-text" class="text-xl font-bold text-slate-700"></p>
            </div>
            <p class="text-xs text-slate-400">Ya puedes cerrar esta ventana o pestaña.</p>
        </div>
    </div>

    <script>
        // BANCO TOTAL DE 50 PREGUNTAS
        const bancoPreguntas = [
            { pregunta: "¿Cuál es la capital de Bolivia?", opciones: ["La Paz y Sucre", "Santa Cruz", "Cochabamba", "Tarija"], correcta: 0 },
            { pregunta: "¿Qué lenguaje se usa principalmente para estilizar páginas web?", opciones: ["Python", "HTML", "CSS", "SQL"], correcta: 2 },
            { pregunta: "¿Cuál es el resultado de 5 + 3 * 2?", opciones: ["16", "11", "10", "13"], correcta: 1 },
            { pregunta: "¿Qué etiqueta HTML se usa para crear un enlace?", opciones: ["<link>", "<a>", "<href>", "<url>"], correcta: 1 },
            { pregunta: "¿Qué sistema gestor de bases de datos es relacional?", opciones: ["MongoDB", "PostgreSQL", "Redis", "Firebase"], correcta: 1 },
            { pregunta: "¿Cuál de los siguientes es un lenguaje de programación backend?", opciones: ["CSS", "Python", "HTML", "Tailwind"], correcta: 1 },
            { pregunta: "¿Qué significa la sigla CSS?", opciones: ["Cascading Style Sheets", "Creative Style System", "Computer Styled Sheets", "Cascading Simple Syntax"], correcta: 0 },
            { pregunta: "¿Cuál es el puerto por defecto de desarrollo en Django?", opciones: ["80", "3000", "8000", "5432"], correcta: 2 },
            { pregunta: "¿Qué estructura de datos almacena elementos en orden LIFO?", opciones: ["Cola (Queue)", "Pila (Stack)", "Árbol", "Grafo"], correcta: 1 },
            { pregunta: "¿Qué comando de Git se usa para enviar cambios remotos?", opciones: ["git pull", "git commit", "git push", "git clone"], correcta: 2 },
            { pregunta: "¿En qué año se fundó Bolivia?", opciones: ["1825", "1810", "1830", "1899"], correcta: 0 },
            { pregunta: "¿Cuál es el río más largo del mundo?", opciones: ["Nilo", "Amazonas", "Misisipi", "Yangtsé"], correcta: 1 },
            { pregunta: "¿Quién escribió 'Don Quijote de la Mancha'?", opciones: ["Lope de Vega", "Miguel de Cervantes", "Pablo Neruda", "Gabriel García Márquez"], correcta: 1 },
            { pregunta: "¿Cuál es el elemento químico cuyo símbolo es O?", opciones: ["Oro", "Osmio", "Oxígeno", "Oculto"], correcta: 2 },
            { pregunta: "¿Cuántos bits conforman un byte?", opciones: ["4", "8", "16", "32"], correcta: 1 },
            { pregunta: "¿Qué planeta es conocido como el planeta rojo?", opciones: ["Venus", "Júpiter", "Marte", "Saturno"], correcta: 2 },
            { pregunta: "¿Cuál es la moneda oficial de Japón?", opciones: ["Yuan", "Dólar", "Yen", "Won"], correcta: 2 },
            { pregunta: "¿Qué significa la sigla HTML?", opciones: ["HyperText Markup Language", "High Tech Multi Language", "Hyper Transfer Main Loop", "Home Tool Markup Language"], correcta: 0 },
            { pregunta: "¿Cuál es el resultado de 8 / 2 (2 + 2)?", opciones: ["1", "16", "8", "4"], correcta: 1 },
            { pregunta: "¿Qué dispositivo se considera el cerebro de la computadora?", opciones: ["Memoria RAM", "Disco Duro", "CPU", "Tarjeta Gráfica"], correcta: 2 },
            { pregunta: "¿Cuál es el país más grande del mundo?", opciones: ["China", "Canadá", "Estados Unidos", "Rusia"], correcta: 3 },
            { pregunta: "¿En qué continente se encuentra Egipto?", opciones: ["Asia", "África", "Europa", "Oceanía"], correcta: 1 },
            { pregunta: "¿Qué gas abunda más en la atmósfera terrestre?", opciones: ["Oxígeno", "Dióxido de Carbono", "Nitrógeno", "Hidrógeno"], correcta: 2 },
            { pregunta: "¿Cuál es la velocidad de la luz en el vacío (aprox.)?", opciones: ["300,000 km/s", "150,000 km/s", "1,080 km/s", "3,000 km/s"], correcta: 0 },
            { pregunta: "¿Qué estructura de datos opera bajo el principio FIFO (First In, First Out)?", opciones: ["Pila", "Cola", "Árbol Binario", "Tabla Hash"], correcta: 1 },
            { pregunta: "¿Quién formuló la teoría de la relatividad?", opciones: ["Isaac Newton", "Albert Einstein", "Nikola Tesla", "Galileo Galilei"], correcta: 1 },
            { pregunta: "¿Cuál es el océano más grande del mundo?", opciones: ["Atlántico", "Índico", "Ártico", "Pacífico"], correcta: 3 },
            { pregunta: "¿Qué significa SQL?", opciones: ["Structured Query Language", "Simple Question Language", "System Quality Link", "Server Query Logic"], correcta: 0 },
            { pregunta: "¿Cuál es el hueso más largo del cuerpo humano?", opciones: ["Húmero", "Fémur", "Tibia", "Radio"], correcta: 1 },
            { pregunta: "¿Qué comando se usa en Linux para listar archivos de un directorio?", opciones: ["dir", "list", "ls", "show"], correcta: 2 },
            { pregunta: "¿Cuál es la capital de Argentina?", opciones: ["Rosario", "Córdoba", "Buenos Aires", "Mendoza"], correcta: 2 },
            { pregunta: "¿Qué tipo de software es un sistema operativo?", opciones: ["Software de aplicación", "Software de sistema", "Hardware lógico", "Firmware de red"], correcta: 1 },
            { pregunta: "¿Cuántos lados tiene un hexágono?", opciones: ["5", "6", "7", "8"], correcta: 1 },
            { pregunta: "¿Qué puerto usa por defecto el protocolo seguro HTTPS?", opciones: ["80", "8080", "443", "21"], correcta: 2 },
            { pregunta: "¿Cuál es el metal más caro del mundo actualmente?", opciones: ["Oro", "Platino", "Rodio", "Plata"], correcta: 2 },
            { pregunta: "¿En qué año llegó el hombre a la Luna?", opciones: ["1965", "1969", "1972", "1981"], correcta: 1 },
            { pregunta: "¿Qué significa la sigla URL?", opciones: ["Uniform Resource Locator", "Universal Record Link", "Unified Retrieval Line", "User Registered Login"], correcta: 0 },
            { pregunta: "¿Cuál es la montaña más alta del mundo?", opciones: ["K2", "Everest", "Aconcagua", "Kilimanjaro"], correcta: 1 },
            { pregunta: "¿Qué protocolo se usa para enviar correos electrónicos?", opciones: ["HTTP", "FTP", "SMTP", "SSH"], correcta: 2 },
            { pregunta: "¿Cuál es el resultado de 9 al cuadrado ($9^2$)?", opciones: ["18", "81", "72", "90"], correcta: 1 },
            { pregunta: "¿Qué empresa desarrolló el sistema operativo Android?", opciones: ["Apple", "Microsoft", "Google", "IBM"], correcta: 2 },
            { pregunta: "¿Cuál es el idioma más hablado del mundo por número de nativos?", opciones: ["Inglés", "Español", "Chino mandarín", "Hindi"], correcta: 2 },
            { pregunta: "¿Qué elemento químico tiene el símbolo Fe?", opciones: ["Flúor", "Hierro", "Fósforo", "Francio"], correcta: 1 },
            { pregunta: "¿Cuál es el órgano más grande del cuerpo humano?", opciones: ["El hígado", "El corazón", "El cerebro", "La piel"], correcta: 3 },
            { pregunta: "¿Qué significa la palabra 'API' en software?", opciones: ["Application Programming Interface", "Advanced Program Integration", "Automated Process Input", "Application Protocol Interaction"], correcta: 0 },
            { pregunta: "¿Cuál es la capital de Francia?", opciones: ["Lyon", "Marsella", "París", "Niza"], correcta: 2 },
            { pregunta: "¿Qué significa RAM en informática?", opciones: ["Readily Accessible Memory", "Random Access Memory", "Run Active Module", "Rapid Allocation Machine"], correcta: 1 },
            { pregunta: "¿Cuántos grados suman los ángulos internos de un triángulo?", opciones: ["90°", "180°", "360°", "270°"], correcta: 1 },
            { pregunta: "¿Cuál es el animal terrestre más rápido del mundo?", opciones: ["León", "Guepardo", "Antílope", "Caballo"], correcta: 1 },
            { pregunta: "¿Qué comando de Git crea una copia local de un repositorio remoto?", opciones: ["git clone", "git init", "git fetch", "git pull"], correcta: 0 }
        ];

        let examenActual = [];
        let indiceActual = 0;
        let puntaje = 0;
        let tiempoRestante = 30;
        let temporizador;
        let respondido = false;

        function iniciarQuiz() {
            let bancoMeclado = [...bancoPreguntas].sort(() => Math.random() - 0.5);
            examenActual = bancoMeclado.slice(0, 10);
            indiceActual = 0;
            puntaje = 0;
            
            document.getElementById('result-container').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            document.getElementById('header-container').classList.remove('hidden');
            
            cargarPregunta();
        }

        function cargarPregunta() {
            clearInterval(temporizador);
            respondido = false;
            tiempoRestante = 30;
            document.getElementById('timer').innerText = tiempoRestante;

            if (indiceActual >= examenActual.length) {
                mostrarResultados();
                return;
            }

            const q = examenActual[indiceActual];
            document.getElementById('question-progress').innerText = `Pregunta ${indiceActual + 1} de ${examenActual.length}`;
            document.getElementById('question-text').innerText = q.pregunta;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const opcionesConIndice = q.opciones.map((op, i) => ({ texto: op, esOriginal: i === q.correcta }));
            opcionesConIndice.sort(() => Math.random() - 0.5);

            opcionesConIndice.forEach((opcion) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 hover:bg-slate-50 font-medium text-slate-700 transition flex justify-between items-center shadow-sm";
                btn.innerHTML = `<span>${opcion.texto}</span>`;
                btn.onclick = () => verificarRespuesta(opcion.esOriginal, btn, opcionesConIndice);
                optionsContainer.appendChild(btn);
            });

            iniciarTemporizador();
        }

        function iniciarTemporizador() {
            temporizador = setInterval(() => {
                tiempoRestante--;
                document.getElementById('timer').innerText = tiempoRestante;
                
                if (tiempoRestante <= 0) {
                    clearInterval(temporizador);
                    tiempoAgotado();
                }
            }, 1000);
        }

        function tiempoAgotado() {
            if (respondido) return;
            respondido = true;

            const botones = document.getElementById('options-container').children;
            Array.from(botones).forEach((btn) => {
                btn.disabled = true;
            });

            setTimeout(() => {
                indiceActual++;
                cargarPregunta();
            }, 1200);
        }

        function verificarRespuesta(esCorrecta, botonSeleccionado, todasLasOpciones) {
            if (respondido) return;
            respondido = true;
            clearInterval(temporizador);

            const botones = document.getElementById('options-container').children;

            Array.from(botones).forEach((btn, idx) => {
                btn.disabled = true;
                if (todasLasOpciones[idx] && todasLasOpciones[idx].esOriginal) {
                    btn.classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                }
            });

            if (esCorrecta) {
                puntaje++;
                if (botonSeleccionado) {
                    botonSeleccionado.classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                }
            } else {
                if (botonSeleccionado) {
                    botonSeleccionado.classList.add('bg-red-100', 'border-red-500', 'text-red-800');
                }
            }

            setTimeout(() => {
                indiceActual++;
                cargarPregunta();
            }, 1500);
        }

        function mostrarResultados() {
            document.getElementById('header-container').classList.add('hidden');
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('result-container').classList.remove('hidden');
            
            const notaFinal = (puntaje / examenActual.length) * 100;
            document.getElementById('score-text').innerHTML = `Tu calificación: <span class="text-blue-600 font-extrabold">${puntaje} / ${examenActual.length}</span> (${notaFinal.toFixed(0)}%)`;
        }

        iniciarQuiz();
    </script>
</body>
</html>
